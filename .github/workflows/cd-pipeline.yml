name: CD

on:
  push:
    branches: [main, master, production]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/barcode-gen
  DEPLOY_DIR: /barcode/barcodegen

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: config/prod/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:prod
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: config/prod/docker-compose.yml
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            docker network inspect barcode_shared >/dev/null 2>&1 || docker network create barcode_shared
            : > .env
            echo "NODE_ENV=production" >> .env
            echo "PORT=8080" >> .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}" >> .env
            echo "BILLING_URL=${{ secrets.BILLING_URL }}" >> .env
            echo "KAFKA_ENABLED=${{ vars.KAFKA_ENABLED || 'true' }}" >> .env
            echo "KAFKA_CLIENT_ID=barcodegen" >> .env
            echo "KAFKA_BROKERS=${{ secrets.KAFKA_BROKERS }}" >> .env
            echo "BARCODEGEN_SERVICE_TOKEN=${{ secrets.BARCODEGEN_SERVICE_TOKEN }}" >> .env
            echo "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS || '' }}" >> .env
            echo "RENDER_URL=http://render:8000" >> .env
            echo "RENDER_TIMEOUT=${{ vars.RENDER_TIMEOUT || '30000' }}" >> .env
            echo "RENDER_MAX_CONCURRENCY=${{ vars.RENDER_MAX_CONCURRENCY || '4' }}" >> .env
            echo "RENDER_QUEUE_SIZE=${{ vars.RENDER_QUEUE_SIZE || '0' }}" >> .env
            echo "STORAGE_ENDPOINT=${{ secrets.STORAGE_ENDPOINT }}" >> .env
            echo "STORAGE_BUCKET=${{ vars.STORAGE_BUCKET || 'barcodes' }}" >> .env
            echo "STORAGE_ACCESS_KEY=${{ secrets.STORAGE_ACCESS_KEY }}" >> .env
            echo "STORAGE_SECRET_KEY=${{ secrets.STORAGE_SECRET_KEY }}" >> .env
            echo "STORAGE_USE_SSL=${{ vars.STORAGE_USE_SSL || 'false' }}" >> .env
            echo "STORAGE_PUBLIC_URL=${{ secrets.STORAGE_PUBLIC_URL }}" >> .env
            chmod 600 .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker rm -f barcodegen_app || true
            docker compose --project-name barcodegen -f docker-compose.yml pull app
            docker compose --project-name barcodegen -f docker-compose.yml up -d app
            docker compose --project-name barcodegen -f docker-compose.yml ps app
            docker run --rm --network barcode_shared curlimages/curl:8.10.1 -fsS http://barcodegen:8080/api/v1/healthz
            docker image prune -f
