name: barcodegen

services:
  app:
    container_name: barcodegen_app_dev
    image: barcodegen:dev
    build:
      context: ../..
      dockerfile: config/dev/Dockerfile
    env_file: ../../.env
    environment:
      NODE_ENV: development
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL:-postgresql://billing:billing@postgres:5432/barcodegen_db}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-dev-barcodegen-access-secret}"
      BILLING_URL: "${BILLING_URL:-http://bff:8080/internal/v1/billing}"
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_CLIENT_ID: "${KAFKA_CLIENT_ID:-barcodegen}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-kafka:9092}"
      BARCODEGEN_SERVICE_TOKEN: "${BARCODEGEN_SERVICE_TOKEN:-dev-barcodegen-service-token}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
      RENDER_URL: "${RENDER_URL:-http://render:8000}"
      RENDER_TIMEOUT: "${RENDER_TIMEOUT:-30000}"
      RENDER_MAX_CONCURRENCY: "${RENDER_MAX_CONCURRENCY:-4}"
      RENDER_QUEUE_SIZE: "${RENDER_QUEUE_SIZE:-0}"
    ports:
      # Только dev: прямой доступ для отладки (envoy в проде). 9229 — debug.
      - "18080:8080"
      - "9229:9229"
    volumes:
      - ../../src:/app/src
      - ../../prisma:/app/prisma
    command: >
      sh -c "rm -f tsconfig*.tsbuildinfo && yarn prisma generate && yarn prisma migrate deploy && yarn start:dev"
    depends_on:
      - render
    networks:
      barcode-shared:
        aliases: [barcodegen]

  render:
    container_name: barcode_render_dev
    image: barcode-render:dev
    build:
      context: ../../../render
      dockerfile: config/dev/Dockerfile
    environment:
      PORT: "8000"
      # dev по умолчанию использует локальный S3 (s3mock). Пусто → локальный /files.
      STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:-s3mock:9090}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-barcodes}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:-test}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:-test}"
      STORAGE_USE_SSL: "${STORAGE_USE_SSL:-false}"
      STORAGE_PUBLIC_URL: "${STORAGE_PUBLIC_URL:-http://localhost:19090}"
      RENDER_PUBLIC_URL: "${RENDER_PUBLIC_URL:-http://localhost:18000/files}"
    ports:
      # Только dev: браузерный доступ к PNG в локальном режиме.
      - "18000:8000"
    depends_on:
      - s3mock
    networks:
      barcode-shared:
        aliases: [render]

  # Локальный S3-совместимый сервер (MinIO в окружении недоступен). Только dev.
  s3mock:
    image: adobe/s3mock:latest
    container_name: barcode_s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: barcodes
    ports:
      - "19090:9090"
    networks:
      barcode-shared:
        aliases: [s3mock]

networks:
  barcode-shared:
    external: true
    name: barcode_shared
