name: barcodegen

services:
  app:
    container_name: barcodegen_app
    image: "${BARCODEGEN_IMAGE:-ghcr.io/OWNER/barcode-gen:prod}"
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}"
      BILLING_URL: "${BILLING_URL:?BILLING_URL is required}"
      KAFKA_ENABLED: "${KAFKA_ENABLED:-true}"
      KAFKA_CLIENT_ID: "${KAFKA_CLIENT_ID:-barcodegen}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-kafka:9092}"
      BARCODEGEN_SERVICE_TOKEN: "${BARCODEGEN_SERVICE_TOKEN:?BARCODEGEN_SERVICE_TOKEN is required}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      RENDER_URL: "${RENDER_URL:-http://render:8000}"
      RENDER_TIMEOUT: "${RENDER_TIMEOUT:-30000}"
      RENDER_MAX_CONCURRENCY: "${RENDER_MAX_CONCURRENCY:-4}"
      RENDER_QUEUE_SIZE: "${RENDER_QUEUE_SIZE:-0}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { cpus: "1.0", memory: 1G }
    networks:
      barcode-shared:
        aliases: [barcodegen]

  render:
    container_name: barcode_render
    image: "${RENDER_IMAGE:-ghcr.io/OWNER/barcode-gen-render:prod}"
    restart: unless-stopped
    environment:
      PORT: "8000"
      STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-barcodes}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}"
      STORAGE_USE_SSL: "${STORAGE_USE_SSL:-false}"
      STORAGE_PUBLIC_URL: "${STORAGE_PUBLIC_URL:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
        reservations: { cpus: "0.5", memory: 512M }
    networks:
      barcode-shared:
        aliases: [render]

networks:
  barcode-shared:
    external: true
    name: barcode_shared
